name: Build stock search master

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/build_stock_master.py"
      - ".github/workflows/stock-master.yml"
  schedule:
    - cron: "5 6 * * 1-5"

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/build_stock_master.py
      - name: Commit master
        run: |
          git config user.name "Invest Pilot Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/stock-master.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh stock search master"
          git pull --rebase origin main
          git push
  deploy:
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
