name: Background stock research

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/latest-ranking.json"
      - "scripts/background_research.py"
      - ".github/workflows/research.yml"
  schedule:
    - cron: "35 */3 * * 1-5"

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Search top candidates in background
        run: python scripts/background_research.py
      - name: Commit research cache
        run: |
          if [ ! -f data/research.json ]; then exit 0; fi
          git config user.name "Invest Pilot Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/research.json
          git diff --cached --quiet && exit 0
          git commit -m "Refresh background research"
          git pull --rebase origin main
          git push
