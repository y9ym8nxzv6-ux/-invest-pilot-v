name: Background stock research

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/background_research.py"
      - ".github/workflows/research.yml"
  schedule:
    - cron: "35 */3 * * 1-5"

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Search top candidates in background
        run: python scripts/background_research.py
      - name: Commit research cache
        run: |
          if [ ! -f data/research.json ]; then exit 0; fi
          git config user.name "Invest Pilot Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/research.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh background research"
          git pull --rebase origin main
          git push

  deploy:
    needs: research
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
