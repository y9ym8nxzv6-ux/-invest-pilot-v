name: Build market snapshot

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/build_snapshot.py"
      - ".github/workflows/market-data.yml"
  schedule:
    - cron: "17 */3 * * 1-5"

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build top 100 and background research
        run: python scripts/build_snapshot.py
      - name: Commit refreshed data
        run: |
          git config user.name "Invest Pilot Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/latest-ranking.json data/research.json
          git diff --cached --quiet && exit 0
          git commit -m "Refresh market snapshot [skip ci]"
          git push
