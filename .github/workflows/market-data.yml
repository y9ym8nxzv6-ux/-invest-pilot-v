name: Build market snapshot

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/build_snapshot.py"
      - ".github/workflows/market-data.yml"
  schedule:
    - cron: "20 7 * * 1-5"

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install market-data dependencies
        run: pip install --disable-pip-version-check pandas xlrd yfinance
      - name: Build top 100
        run: python scripts/build_snapshot.py
      - name: Commit refreshed ranking
        run: |
          git config user.name "Invest Pilot Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/latest-ranking.json
          git diff --cached --quiet && exit 0
          git commit -m "Refresh market ranking [skip ci]"
          git pull --rebase origin main
          git push
