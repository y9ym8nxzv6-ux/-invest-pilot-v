name: Build market snapshot

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/build_snapshot.py"
      - "scripts/background_research.py"
      - ".github/workflows/market-data.yml"
  schedule:
    - cron: "20 7 * * 1-5"

concurrency:
  group: market-snapshot
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install market-data dependencies
        run: pip install --disable-pip-version-check pandas xlrd yfinance
      - name: Build ranking and 20-day outlook
        run: python scripts/build_snapshot.py
      - name: Self-optimize rebalance interval
        run: node scripts/optimize_strategy.js
      - name: Refresh research cache
        run: python scripts/background_research.py
      - name: Commit refreshed data
        run: |
          git config user.name "Invest Pilot Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/latest-ranking.json data/all-analysis.json data/backtest-history.json data/research.json data/strategy-config.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh market data"
          git pull --rebase origin main
          git push

  deploy:
    needs: snapshot
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
